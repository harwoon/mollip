
        <!DOCTYPE html>
        <html lang="ko">
        <head>
            <meta charset="UTF-8" />
            <meta
                name="viewport"
                content="width=device-width, initial-scale=1.0"
            />
        </head>

        <body
            style="
                margin: 0;
                padding: 40px 15px;
                background: #f3efff;
                font-family: Arial, 'Noto Sans KR', sans-serif;
                color: #292531;
            "
        >
            <!-- 메일 전체 카드 -->
            <div
                style="
                    max-width: 620px;
                    margin: 0 auto;
                    background: #ffffff;
                    border-radius: 24px;
                    overflow: hidden;
                    box-shadow: 0 15px 40px rgba(92, 67, 160, 0.15);
                "
            >
                <!-- 상단 보라색 영역 -->
                <div
                    style="
                        padding: 32px 30px;
                        text-align: center;
                        background: linear-gradient(
                            135deg,
                            #7657c8,
                            #9377e0
                        );
                    "
                >
                    <!-- Mollip 로고 이미지 -->
                    <img
                        src="http://127.0.0.1:3000/images/LOGO.png"
                        alt="Mollip"
                        width="150"
                        style="
                            display: block;
                            width: 150px;
                            max-width: 100%;
                            height: auto;
                            margin: 0 auto 8px;
                            border: 0;
                        "
                    />

                    <p
                        style="
                            margin: 0;
                            color: rgba(255, 255, 255, 0.85);
                            font-size: 13px;
                            line-height: 1.6;
                        "
                    >
                        오늘도 작은 몰입을 시작해 보세요
                    </p>
                </div>

                <!-- 본문 영역 -->
                <div
                    style="
                        padding: 42px 38px 36px;
                    "
                >
                    <!-- 메일 제목 -->
                    <h1
                        style="
                            margin: 0 0 30px;
                            color: #292531;
                            font-size: 25px;
                            line-height: 1.45;
                            text-align: center;
                            word-break: keep-all;
                        "
                    >
                        최근 학습 기록이 기다리고 있어요.
                    </h1>

                    <!-- 사용자 인사 -->
                    <div
                        style="
                            margin-bottom: 26px;
                            padding: 18px 20px;
                            background: #f7f4ff;
                            border: 1px solid #e5ddfa;
                            border-radius: 14px;
                            color: #4e4266;
                            font-size: 15px;
                            line-height: 1.7;
                        "
                    >
                        <strong
                            style="
                                color: #7657c8;
                                font-weight: 700;
                            "
                        >
                            홍길동님
                        </strong>,
                        안녕하세요.
                    </div>

                    <!-- 상태별 안내 문구 -->
                    <div
                        style="
                            margin-bottom: 28px;
                            color: #55505f;
                            font-size: 15px;
                            line-height: 1.9;
                            word-break: keep-all;
                        "
                    >
                        
                    <p
                        style="
                            margin: 0 0 12px;
                        "
                    >
                        최근
                        <strong
                            style="
                                color: #7657c8;
                            "
                        >
                            7일 동안
                        </strong>
                        학습 기록이 확인되지 않았어요.
                    </p>

                    <p
                        style="
                            margin: 0;
                        "
                    >
                        부담 없이 짧은 시간부터 다시 시작해 보세요.<br>
                        오늘의 작은 학습이 새로운 흐름을 만들 수 있습니다.
                    </p>
                
                    </div>

                    <!-- 강조 안내 -->
                    <div
                        style="
                            margin-bottom: 30px;
                            padding: 17px 20px;
                            background: #fff9ea;
                            border: 1px solid #f1dfad;
                            border-radius: 13px;
                            color: #6d5a29;
                            font-size: 14px;
                            line-height: 1.7;
                            word-break: keep-all;
                        "
                    >
                        꾸준한 학습으로 목표를 달성해 보세요!
                    </div>

                    <!-- 이동 버튼 -->
                    <div
                        style="
                            text-align: center;
                        "
                    >
                        <a
                            href="http://localhost:5173/home"
                            style="
                                display: inline-block;
                                min-width: 220px;
                                padding: 15px 24px;
                                background: #7657c8;
                                color: #ffffff;
                                text-decoration: none;
                                border-radius: 12px;
                                font-size: 15px;
                                font-weight: 700;
                                text-align: center;
                                box-shadow: 0 8px 18px rgba(118, 87, 200, 0.25);
                            "
                        >
                            Mollip에서 공부 시작하기
                        </a>
                    </div>
                </div>

                <!-- 하단 안내 -->
                <div
                    style="
                        padding: 20px 30px;
                        background: #faf8ff;
                        color: #9992a4;
                        font-size: 12px;
                        line-height: 1.6;
                        text-align: center;
                    "
                >
                    본 메일은 Mollip 회원 관리 정책에 따라 발송되었습니다.
                </div>
            </div>
        </body>
        </html>
